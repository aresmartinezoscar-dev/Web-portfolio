<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Tu Nombre] — Portfolio OS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ======================= BOOT SCREEN ======================= -->
<div id="boot">
  <canvas id="stars-boot"></canvas>
  <div class="boot-content">
    <div class="boot-logo">[Tu Nombre]<span class="cursor-blink">_</span></div>
    <div class="boot-status" id="bootStatus">iniciando…</div>
    <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  </div>
</div>

<!-- ======================= DESKTOP ======================= -->
<div id="desktop" hidden>
  <canvas id="stars-desktop"></canvas>

  <div class="topbar">
    <span class="topbar-brand">[Tu Nombre] OS</span>
    <span class="topbar-clock" id="clock">--:--</span>
  </div>

  <div class="icons" id="desktopIcons">
    <button class="icon" data-window="about">
      <div class="glyph glyph-user"></div><span>Sobre mí.app</span>
    </button>
    <button class="icon" data-window="experiencia">
      <div class="glyph glyph-briefcase"></div><span>Experiencia.app</span>
    </button>
    <button class="icon" data-window="formacion">
      <div class="glyph glyph-badge"></div><span>Formación.app</span>
    </button>
    <button class="icon" data-window="proyectos">
      <div class="glyph glyph-grid"></div><span>Proyectos.app</span>
    </button>
    <button class="icon" data-window="contacto">
      <div class="glyph glyph-at"></div><span>Contacto.app</span>
    </button>
    <button class="icon" data-window="terminal">
      <div class="glyph glyph-term"></div><span>Terminal.app</span>
    </button>
  </div>

  <!-- ======================= WINDOWS (contenido en data.js) ======================= -->
  <div id="windowsRoot"></div>

  <!-- ======================= CONTEXT MENU ======================= -->
  <div id="ctxMenu" class="ctx-menu" hidden>
    <button data-action="wallpaper">🎨 Cambiar fondo</button>
    <button data-action="about">💻 Sobre este equipo</button>
    <button data-action="arrange">🗂️ Ordenar iconos</button>
  </div>

  <!-- ======================= DOCK ======================= -->
  <div class="dock" id="dock"></div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
